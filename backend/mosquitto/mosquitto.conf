# Cấu hình Mosquitto mẫu: đổi cổng và bắt buộc đăng nhập bằng username/password.
# Tạo file mật khẩu một lần (lệnh sẽ hỏi mật khẩu):
#   mosquitto_passwd -c backend/mosquitto/passwd <username>
# Chạy broker:
#   mosquitto -c backend/mosquitto/mosquitto.conf
# Kiểm tra truy cập ẩn danh bị từ chối:
#   mosquitto_sub -h localhost -p 2912 -t "#"                       -> Connection Refused: not authorised (bị từ chối)
#   mosquitto_sub -h localhost -p 2912 -t "#" -u <user> -P <pass>   -> connected (kết nối thành công)

listener 2912
allow_anonymous false
password_file backend/mosquitto/passwd
