# Example Mosquitto config: custom port + mandatory username/password.
# Create the password file once (prompts for the password):
#   mosquitto_passwd -c backend/mosquitto/passwd <username>
# Run the broker:
#   mosquitto -c backend/mosquitto/mosquitto.conf
# Test that anonymous access is rejected:
#   mosquitto_sub -h localhost -p 2912 -t "#"                       -> Connection Refused: not authorised
#   mosquitto_sub -h localhost -p 2912 -t "#" -u <user> -P <pass>   -> connected

listener 2912
allow_anonymous false
password_file backend/mosquitto/passwd
